    <path id="hub" d="M384.9 76V48.7H357.9V76H338.1V6H357.9V32.3H384.9V6H404.7V76ZM440.6 76.9Q433.9 76.9 428.7 74.2Q423.5 71.6 420.6 66.2Q417.6 60.7 417.6 52.1V21.8H436.6V49Q436.6 55.3 439 58Q441.4 60.7 445.6 60.7Q449.8 60.7 452.8 57.7Q455.8 54.7 455.8 47.9V21.8H474.8V76H456.7V70.2Q453.6 73.6 449.4 75.2Q445.2 76.9 440.6 76.9ZM521.1 76.9Q510.5 76.9 505.1 70.6V76H487V1.8H506V26.5Q511.5 20.9 521.1 20.9Q528.5 20.9 534.5 24.3Q540.5 27.7 544.1 33.9Q547.7 40.2 547.7 48.8Q547.7 57.5 544.1 63.8Q540.5 70 534.5 73.5Q528.5 76.9 521.1 76.9ZM517.1 61.8Q521.9 61.8 525.2 58.4Q528.5 55 528.5 48.8Q528.5 42.7 525.2 39.3Q521.9 36 517.1 36Q512.3 36 509 39.3Q505.7 42.7 505.7 48.8Q505.7 55 509 58.4Q512.3 61.8 517.1 61.8Z"/>
  </defs>
  <g filter="url(#drop)"><use href="#agent" y="3.5"/><use href="#hub" y="3.5"/></g>
  <use href="#agent" y="3.5" fill="#236b27"/>
  <use href="#hub" y="3.5" fill="#522569"/>
  <g filter="url(#bevel)">
    <use href="#agent" fill="url(#green)"/>
    <use href="#hub" fill="url(#purple)"/>
  </g>
</svg>
