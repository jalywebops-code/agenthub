<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 106">
  <!-- The AgentHub wordmark for the tactile style, on dark panels: raised lettering, lit from above.
       The letters are outlines (traced from Montserrat ExtraBold, SIL Open Font License 1.1), not text, so no font is
       needed and it looks the same on every machine. Each word is drawn twice: a dark side wall 3.5 units down, then
       the face with a bevel (lit top rim, shaded bottom rim). tactile-wordmark-light.svg is the same drawing in the light-mode colours. -->
  <defs>
    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="6" x2="0" y2="97">
      <stop offset="0" stop-color="#7cdc7a"/><stop offset="1" stop-color="#48b04a"/>
    </linearGradient>
    <linearGradient id="purple" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="77">
      <stop offset="0" stop-color="#bd7fda"/><stop offset="1" stop-color="#9450b5"/>
    </linearGradient>
    <filter id="bevel" filterUnits="userSpaceOnUse" x="0" y="0" width="554" height="106">
      <feOffset in="SourceAlpha" dy="3" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="topRim"/>
      <feFlood flood-color="#fff" flood-opacity=".5"/>
      <feComposite in2="topRim" operator="in" result="lit"/>
      <feOffset in="SourceAlpha" dy="-3" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="bottomRim"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="bottomRim" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lit"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="554" height="106">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="2.5" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".7"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
