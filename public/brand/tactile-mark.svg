<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.5 4.5 55 55">
  <!-- The AgentHub mark for the tactile style, on dark panels: the four agents are green keys standing proud of the
       panel (side wall, lit top rim, shaded bottom rim), the hub is a big purple key between them (the clay mark's proportions).
       tactile-mark-light.svg is the same drawing in the light-mode colours. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cdc7a"/><stop offset="1" stop-color="#48b04a"/>
    </linearGradient>
    <filter id="bevel" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feOffset in="SourceAlpha" dy="1.3" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="topRim"/>
      <feFlood flood-color="#fff" flood-opacity=".5"/>
      <feComposite in2="topRim" operator="in" result="lit"/>
      <feOffset in="SourceAlpha" dy="-1.3" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="bottomRim"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="bottomRim" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lit"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1"/>
      <feOffset dy="1.4" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".7"/>
      <feComposite in2="blur" operator="in"/>
    </filter>
        <linearGradient id="hubFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c992e6"/><stop offset="1" stop-color="#9252b8"/>
    </linearGradient>
    <path id="hub" d="M32 19 44 31 32 43 20 31Z" stroke-width="3" stroke-linejoin="round"/>
    <g id="agents">
      <path d="M15 7h8a7 7 0 0 1 7 7v1l-14 14h-1a7 7 0 0 1-7-7v-8a7 7 0 0 1 7-7Z"/>
      <path d="M49 7h-8a7 7 0 0 0-7 7v1l14 14h1a7 7 0 0 0 7-7v-8a7 7 0 0 0-7-7Z"/>
      <path d="M15 55h8a7 7 0 0 0 7-7v-1l-14-14h-1a7 7 0 0 0-7 7v8a7 7 0 0 0 7 7Z"/>
      <path d="M49 55h-8a7 7 0 0 1-7-7v-1l14-14h1a7 7 0 0 1 7 7v8a7 7 0 0 1-7 7Z"/>
    </g>
  </defs>
  <use href="#agents" y="2.2" filter="url(#drop)"/>
  <use href="#agents" y="2.2" fill="#236b27"/>
  <use href="#agents" fill="url(#face)" filter="url(#bevel)"/>
  <use href="#hub" y="2.2" fill="#000" stroke="#000" filter="url(#drop)"/>
  <use href="#hub" y="2.2" fill="#5b2a78" stroke="#5b2a78"/>
  <use href="#hub" fill="url(#hubFace)" stroke="url(#hubFace)" filter="url(#bevel)"/>
</svg>
