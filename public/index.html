<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgentHub — Agent control board</title>
  <meta name="description" content="Private control board for Hermes, OpenClaw, Claude Code and Codex sessions: see what is waiting on you and act on it.">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="AgentHub">
  <meta property="og:description" content="Private multi-agent control board.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0f1115">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AgentHub">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/brand/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <!-- The opt-in "tactile" look: it only applies under html[data-style="tactile"] (Settings → Board → Style). -->
  <link rel="stylesheet" href="/tactile.css">
</head>
<body>
  <a class="skip" href="#board">Skip to sessions</a>

  <!-- Sticky bar: logo, New chat, settings. Everything below it scrolls with the page. -->
  <header class="topbar">
    <div class="top-row">
      <h1 class="wordmark"><button type="button" class="wordmark-btn" id="logoRefresh" title="Refresh: read every agent now" aria-label="AgentHub: refresh, read every agent now"><img class="mark-logo logo-classic" src="/brand/mark.png" width="28" height="28" alt=""><img class="mark-logo logo-tactile logo-dark" src="/brand/tactile-mark.svg" width="28" height="28" alt="" hidden><img class="mark-logo logo-tactile logo-light" src="/brand/tactile-mark-light.svg" width="28" height="28" alt="" hidden><img class="wordmark-img logo-classic" src="/brand/wordmark.png" width="104" height="22" alt=""><img class="wordmark-img logo-tactile logo-dark" src="/brand/tactile-wordmark.svg" width="115" height="22" alt="" hidden><img class="wordmark-img logo-tactile logo-light" src="/brand/tactile-wordmark-light.svg" width="115" height="22" alt="" hidden></button></h1>
      <span class="updated" id="updated" aria-live="polite"></span>
      <button type="button" class="refresh-btn theme-btn" id="themeBtn" aria-label="Switch to light mode" title="Switch to light mode"><svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></g></svg><svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
      <button type="button" class="refresh-btn" id="refreshBtn" aria-label="Refresh: read every agent now" title="Refresh: read every agent now"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="new-chat" id="newChat" aria-label="Start a new chat">+ New<span class="nc-long"> chat</span></button>
      <button type="button" class="gear" id="settingsBtn" aria-label="Settings" title="Settings">⚙︎</button>
    </div>
  </header>

  <div class="top" aria-label="Agents and filters">
    <div class="agents" role="group" aria-label="Agents. Tap to filter by agent, press and hold for options." id="agentPills"></div>

    <div class="chips" role="group" aria-label="Status filter" id="statusChips">
      <button type="button" data-status="all" aria-pressed="true">All</button>
      <button type="button" data-status="blocked" aria-pressed="false">Blocked</button>
      <button type="button" data-status="review" aria-pressed="false">Review</button>
      <button type="button" data-status="update" aria-pressed="false">Update</button>
      <button type="button" data-status="working" aria-pressed="false">Running</button>
      <button type="button" data-status="idle" aria-pressed="false">Idle</button>
      <button type="button" data-status="done" aria-pressed="false">Done</button>
      <button type="button" data-status="closed" aria-pressed="false">Closed</button>
    </div>

    <!-- How far back, with search beside it (Needs you is the top of the board, so it has no button). -->
    <div class="age-row">
      <!-- Status and time dropdowns: phones show both on one line; computers show Status at the end of the agent row. -->
      <label class="filter-select status-select">
        <span class="sr-only">Status</span>
        <select id="statusSelect">
          <option value="all">All statuses</option>
          <option value="blocked">Blocked</option>
          <option value="review">Review</option>
          <option value="update">Update</option>
          <option value="working">Running</option>
          <option value="idle">Idle</option>
          <option value="done">Done</option>
          <option value="closed">Closed</option>
        </select>
      </label>
      <div class="chips age-chips" role="group" aria-label="How far back" id="ageChips">
        <button type="button" data-age="today" aria-pressed="false">Today</button>
        <button type="button" data-age="7d" aria-pressed="true">7 days</button>
        <button type="button" data-age="30d" aria-pressed="false">30 days</button>
        <button type="button" data-age="all" aria-pressed="false">All</button>
      </div>
      <label class="filter-select age-select">
        <span class="sr-only">How far back</span>
        <select id="ageSelect">
          <option value="today">Today</option>
          <option value="7d">7 days</option>
          <option value="30d">30 days</option>
          <option value="all">All time</option>
        </select>
      </label>
      <!-- Cards per screen on a computer (kept on this device), drawn as little grids: 3 tall, 4 as 2 × 2, or 6 as 2 rows of 3. -->
      <div class="chips grid-chips" role="group" aria-label="Cards per screen" id="gridChips">
        <button type="button" data-grid="3" aria-pressed="false" aria-label="3 cards per screen, one tall row" title="3 per screen: one row of tall cards"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="6" y="1" width="4" height="14" rx="1"/><rect x="11" y="1" width="4" height="14" rx="1"/></svg></button>
        <button type="button" data-grid="4" aria-pressed="false" aria-label="4 cards per screen, 2 by 2" title="4 per screen: 2 × 2"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="1" y="1" width="6.5" height="6.5" rx="1"/><rect x="8.5" y="1" width="6.5" height="6.5" rx="1"/><rect x="1" y="8.5" width="6.5" height="6.5" rx="1"/><rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1"/></svg></button>
        <button type="button" data-grid="6" aria-pressed="false" aria-label="6 cards per screen, 2 rows of 3" title="6 per screen: 2 rows of 3"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="1" y="1" width="4" height="6.5" rx="1"/><rect x="6" y="1" width="4" height="6.5" rx="1"/><rect x="11" y="1" width="4" height="6.5" rx="1"/><rect x="1" y="8.5" width="4" height="6.5" rx="1"/><rect x="6" y="8.5" width="4" height="6.5" rx="1"/><rect x="11" y="8.5" width="4" height="6.5" rx="1"/></svg></button>
      </div>
      <!-- At a glance (computers): live counts for the time window, each one a quick status filter (app.js drawSummary). -->
      <div class="glance" role="group" aria-label="At a glance: tap a count to show only those" id="glance"></div>
      <label class="search">
        <span class="sr-only">Search sessions</span>
        <input type="search" id="search" placeholder="Search…" autocomplete="off">
      </label>
    </div>
  </div>

  <main id="board" tabindex="-1">
    <div class="skeleton-board" id="loading" role="status" aria-label="Loading live sessions">
      <p class="sr-only">Loading live sessions…</p>
      <div class="cards">
        <div class="card skeleton" aria-hidden="true"><div class="sk-line sk-title"></div><div class="sk-line"></div><div class="sk-line sk-short"></div><div class="sk-buttons"></div></div>
        <div class="card skeleton" aria-hidden="true"><div class="sk-line sk-title"></div><div class="sk-line"></div><div class="sk-line sk-short"></div><div class="sk-buttons"></div></div>
        <div class="card skeleton" aria-hidden="true"><div class="sk-line sk-title"></div><div class="sk-line"></div><div class="sk-line sk-short"></div><div class="sk-buttons"></div></div>
        <div class="card skeleton" aria-hidden="true"><div class="sk-line sk-title"></div><div class="sk-line"></div><div class="sk-line sk-short"></div><div class="sk-buttons"></div></div>
      </div>
    </div>
  </main>

  <dialog id="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" class="sheet-head">
      <h2 id="sheetTitle">Details</h2>
      <button class="ghost" value="close" aria-label="Close">Close</button>
    </form>
    <div id="sheetBody" class="sheet-body"></div>
  </dialog>

  <dialog id="login" aria-labelledby="loginTitle">
    <form id="loginForm" class="login">
      <h2 id="loginTitle">Enter board PIN</h2>
      <p class="muted" id="loginNote">Every device logs in once with your board PIN, and stays logged in for a year.</p>
      <label for="pin" class="sr-only">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" pattern="[0-9]{4,12}" required>
      <label for="pin2" class="sr-only">The same PIN again</label>
      <input id="pin2" name="pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="12" pattern="[0-9]{8,12}" placeholder="The same PIN again" hidden>
      <p class="error" id="loginError" role="alert"></p>
      <button type="submit" class="primary" id="loginGo">Unlock</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- Continue waits 5 seconds so a mis-tap can be undone. -->
  <script src="/app.js" type="module"></script>
</body>
</html>
